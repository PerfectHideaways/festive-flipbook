*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 Montserrat,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}

.logo{display:block;flex:none;line-height:0}
.logo img{display:block;height:44px;width:auto}

.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}

.btn:focus-visible,.nav:focus-visible,a.hs:focus-visible,#scrub:focus-visible{outline:2px solid var(--green);outline-offset:2px}

header .btn:hover,.zbar .btn:hover{border-color:rgba(255,255,255,.55)}
header .btn.solid,.zbar .btn.solid{background:transparent;border-color:var(--white)}

.btn svg{width:15px;height:15px}
.menu{position:relative}
.menu ol{color:var(--ink);position:absolute;right:0;top:calc(100% + 6px);z-index:40;list-style:none;margin:0;padding:8px;min-width:230px;background:var(--paper);border:1px solid var(--stone);border-radius:10px;box-shadow:0 12px 30px rgba(34,31,32,.18);display:none}

.menu li button:hover,.menu li button:focus-visible{background:var(--stone)}
.menu li span{font-style:italic;letter-spacing:.01em;color:var(--grey)}
.page{background:#fff;overflow:hidden;position:relative}
.page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
a.hs{position:absolute;display:block;border-radius:3px;z-index:5;-webkit-tap-highlight-color:rgba(129,132,102,.25);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
a.hs::after{content:"";position:absolute;inset:-5px -3px}
@media (hover:hover){ a.hs:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(19,32,44,.22)} }
footer{display:flex;align-items:center;gap:16px;padding:10px clamp(14px,3vw,32px) calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);z-index:30}

.tag{font:italic 400 13px "Libre Baskerville",Georgia,serif;letter-spacing:.01em;color:var(--grey);white-space:nowrap}

/* ---------- Desktop: flipbook ---------- */
html.flip,html.flip body{height:100%}
@supports (height:100dvh){ html.flip,html.flip body{height:100dvh} }
html.flip body{display:flex;flex-direction:column;overflow:hidden}
html.flip main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(8px,3vw,40px);position:relative}
#stage{width:100%;display:flex;justify-content:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--stone);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:10}

#prev{left:clamp(4px,1vw,14px)} #next{right:clamp(4px,1vw,14px)}

html.feed{scroll-snap-type:y proximity}
html.feed header{position:sticky;top:0}
html.feed .nav,html.feed #stage{display:none}
html.feed main{padding:12px 10px calc(var(--fh) + 24px + env(safe-area-inset-bottom,0px))}
#feed{display:none;max-width:760px;margin:0 auto}
html.feed #feed{display:block}
html.feed .page{width:100%;aspect-ratio:2339/1654;margin:0 0 10px;scroll-snap-align:start;scroll-margin-top:calc(var(--hh) + 8px);box-shadow:0 1px 3px rgba(34,31,32,.12)}

html.feed .rates{display:block;background:#fff;margin:0 0 10px;padding:18px clamp(12px,3vw,24px) 6px;scroll-snap-align:start;scroll-margin-top:calc(var(--hh) + 8px);box-shadow:0 1px 3px rgba(34,31,32,.12)}
.rates h2{margin:0;font:400 clamp(20px,5vw,26px)/1.2 "Libre Baskerville",Baskerville,Georgia,serif;letter-spacing:.08em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rates.cont{padding-top:14px}
.rates .sub{margin:2px 0 14px;font:400 15px/1.3 "Libre Baskerville",Baskerville,Georgia,serif;letter-spacing:.08em;color:var(--grey)}
.rates table{width:100%;border-collapse:collapse}
.rates th{font:400 12px/1.3 Montserrat,sans-serif;letter-spacing:.08em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--stone);color:var(--grey)}
.rates td{padding:12px 10px;border-bottom:1px solid var(--stone);vertical-align:top;font-size:14px;line-height:1.45}
.rates td.n{font-family:"Libre Baskerville",Baskerville,Georgia,serif;letter-spacing:.08em}
.rates td.n a{color:var(--ink);text-decoration:none;display:inline-block;padding:2px 0}
.rates td.n a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  0%{transform:translateY(0)}
  22%{transform:translateY(-9px)}
  42%{transform:translateY(0)}
  58%{transform:translateY(-4px)}
  74%{transform:translateY(0)}
  86%{transform:translateY(-1.5px)}
  100%{transform:translateY(0)}

@media (hover:hover){ .rates td.n a:hover{animation:hsBounce .9s cubic-bezier(.33,0,.2,1)} }
@media (max-width:640px){
