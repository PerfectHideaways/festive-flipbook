      if(l.u){ a.href=l.u; a.target='_blank'; a.rel='noopener'; a.setAttribute('aria-label','Open '+l.u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')); }
      else { a.href='#page='+(l.p+1); a.dataset.zp=l.p; a.setAttribute('aria-label','Go to page '+(l.p+1)); }
      d.appendChild(a);
    });
    zpages.appendChild(d);
  });
  zwhere.textContent=(g.length===2?'Pages '+(g[0]+1)+'–'+(g[1]+1):'Page '+(g[0]+1))+' of '+N;
  zprev.disabled=g[0]<=0; znext.disabled=g[g.length-1]>=N-1;
  // single pages open centred (the left edge is often just margin); spreads open at the left so the first page is whole
  zscroll.scrollTo(g.length===1?Math.max(0,(zscroll.scrollWidth-zscroll.clientWidth)/2):0,0);
}
function openZoom(){ zOpener=document.activeElement; zoomEl.hidden=false; document.body.style.overflow='hidden'; renderZoom(groupFor(current)); zscroll.focus({preventScroll:true}); }
function closeZoom(){ if(zoomEl.hidden) return; zoomEl.hidden=true; document.body.style.overflow=''; zpages.textContent=''; goTo(zGroup[0],true); if(zOpener&&zOpener.focus) zOpener.focus(); }
zprev.onclick=()=>{ if(zGroup[0]>0) renderZoom(groupFor(zGroup[0]-1)); };
znext.onclick=()=>{ const n=zGroup[zGroup.length-1]+1; if(n<N) renderZoom(groupFor(n)); };
document.getElementById('zclose').onclick=closeZoom;
document.getElementById('zoomBtn').onclick=openZoom;
zoomEl.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a.hs[data-zp]'); if(a){ e.preventDefault(); renderZoom(groupFor(+a.dataset.zp)); } });
addEventListener('keydown',e=>{
  if(zoomEl.hidden){ if((e.key==='z'||e.key==='Z')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!(e.target.closest&&e.target.closest('input,textarea,[role=menu]'))) openZoom(); return; }
  if(e.key==='Escape') closeZoom();
  else if(e.key==='ArrowRight'&&e.target===zscroll) znext.onclick();
  else if(e.key==='ArrowLeft'&&e.target===zscroll) zprev.onclick(); });
// deep link: …/#page=12
if(START){ const t=Math.min(N,Math.max(1,+START))-1; if('scrollRestoration' in history) history.scrollRestoration='manual'; setTimeout(()=>goTo(t,true),60); }
